<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Edge dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  #stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; }
  #strip { position: absolute; left: 0; top: 0; height: 100%; transition: transform .35s cubic-bezier(.2, .8, .2, 1); }
  .page { position: absolute; top: 0; height: 100%; }
  .page.away iframe { pointer-events: none; }
  iframe { position: absolute; border: 0; border-radius: 12px; background: #000; overflow: hidden; }
  #gear { position: absolute; right: 4px; top: 332px; width: 48px; height: 56px; border: 0; background: none; color: #fff; opacity: .28; cursor: pointer; padding: 8px 6px; z-index: 2; }
  #gear:active { opacity: .8; }
  #gear svg { width: 100%; height: 100%; }
  /* page dots, in the left margin: big touch targets, small dots */
  #dots { position: absolute; left: 0; top: 0; width: 56px; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 2; }
  #dots button { width: 56px; height: 64px; border: 0; background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  #dots button::after { content: ''; width: 12px; height: 12px; border-radius: 50%; background: #fff; opacity: .22; transition: opacity .2s, transform .2s; }
  #dots button.on::after { opacity: .75; transform: scale(1.25); }
  #dots.single { display: none; }
</style>
</head>
<body>
<div id="stage">
  <div id="strip"></div>
  <div id="dots"></div>
  <button id="gear" title="Widget settings" aria-label="Widget settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
</div>
<script>
'use strict';
(async function () {
  const layout = await (await fetch('/layout.json', { cache: 'no-store' })).json();
  const stage = document.getElementById('stage'), strip = document.getElementById('strip'), dots = document.getElementById('dots');
  const W = layout.screen.width, H = layout.screen.height;
  stage.style.width = W + 'px'; stage.style.height = H + 'px';
  document.body.style.background = layout.background || '#000';

  // Older layouts had one flat "widgets" list with positions: treat that as a single page.
  const defs = Array.isArray(layout.widgets) ? Object.fromEntries(layout.widgets.map(w => [w.id, w])) : layout.widgets;
  const pages = layout.pages || [{ name: 'Main', items: layout.widgets.map(w => ({ widget: w.id, x: w.x, y: w.y, w: w.w, h: w.h })) }];

  // Every page is built once and kept loaded, so switching is instant and widgets stay connected.
  const frames = {};   // widget id -> [{ frame, origin }]
  const pageEls = pages.map((pg, i) => {
    const el = document.createElement('div');
    el.className = 'page'; el.style.left = (i * W) + 'px'; el.style.width = W + 'px';
    for (const it of pg.items) {
      const d = defs[it.widget];
      if (!d) { console.warn('Unknown widget in layout:', it.widget); continue; }
      const f = document.createElement('iframe');
      f.src = `http://127.0.0.1:${d.port}/`;
      f.title = `${it.widget} (${pg.name})`;
      Object.assign(f.style, { left: it.x + 'px', top: it.y + 'px', width: it.w + 'px', height: it.h + 'px' });
      el.appendChild(f);
      (frames[it.widget] = frames[it.widget] || []).push({ frame: f, origin: `http://127.0.0.1:${d.port}` });
    }
    strip.appendChild(el);
    return el;
  });
  strip.style.width = (pages.length * W) + 'px';

  // ---------- page switching ----------
  const dotEls = pages.map((pg, i) => {
    const b = document.createElement('button');
    b.title = pg.name; b.setAttribute('aria-label', 'Page ' + (i + 1) + ': ' + pg.name);
    b.addEventListener('click', () => show(i));
    dots.appendChild(b);
    return b;
  });
  dots.classList.toggle('single', pages.length < 2);

  let current = 0;
  try { current = Math.min(pages.length - 1, Math.max(0, Number(localStorage.getItem('edge-page')) || 0)); } catch { /* storage off */ }
  function show(i) {
    current = (i + pages.length) % pages.length;   // wraps around, like iCUE
    strip.style.transform = `translateX(${-current * W}px)`;
    pageEls.forEach((el, n) => el.classList.toggle('away', n !== current));
    dotEls.forEach((b, n) => b.classList.toggle('on', n === current));
    try { localStorage.setItem('edge-page', String(current)); } catch { /* storage off */ }
  }
  strip.style.transition = 'none'; show(current); strip.offsetWidth; strip.style.transition = '';
  window.edgePage = step => show(current + step);   // called by the Alt+Left / Alt+Right hotkeys

  // ---------- live events from the server ----------
  const es = new EventSource('/api/events');
  es.addEventListener('settings', e => {
    const { id, settings } = JSON.parse(e.data);
    for (const t of frames[id] || []) if (t.frame.contentWindow) t.frame.contentWindow.postMessage({ type: 'edge-settings', settings }, t.origin);
  });
  es.addEventListener('page', e => { const d = JSON.parse(e.data); if (typeof d.step === 'number') edgePage(d.step); else if (typeof d.index === 'number') show(d.index); });
  es.addEventListener('reload', () => location.reload());

  // Gear: opens the settings window on the main screen (or a browser tab outside Electron).
  document.getElementById('gear').addEventListener('click', async () => {
    const r = await fetch('/api/open-settings', { method: 'POST', headers: { 'x-edge-dashboard': '1' } });
    const j = await r.json().catch(() => ({}));
    if (!j.opened) window.open('/settings', '_blank');
  });

  // Scale the 2560x720 stage to the window, so a smaller preview window shows the whole layout.
  // The iframes keep their real CSS sizes, so the widgets' size media queries still match.
  function fit() {
    const s = Math.min(innerWidth / W, innerHeight / H);
    stage.style.transform = s === 1 ? '' : `scale(${s})`;
  }
  addEventListener('resize', fit); fit();
})();
</script>
</body>
</html>
