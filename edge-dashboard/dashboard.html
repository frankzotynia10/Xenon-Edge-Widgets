<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Edge dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
  #stage { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; }
  #strip { position: absolute; left: 0; top: 0; height: 100%; transition: transform .35s cubic-bezier(.2, .8, .2, 1); }
  .page { position: absolute; top: 0; height: 100%; }
  .page.away iframe { pointer-events: none; }
  iframe { position: absolute; border: 0; border-radius: 12px; background: #000; overflow: hidden; }
  /* page indicator: fades in at the bottom centre for a moment after a page change */
  #dots { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; gap: 14px; padding: 10px 16px;
    border-radius: 20px; background: rgba(0, 0, 0, .6); z-index: 2; pointer-events: none; opacity: 0; transition: opacity .3s; }
  #dots.show { opacity: 1; }
  #dots span { width: 12px; height: 12px; border-radius: 50%; background: #fff; opacity: .3; }
  #dots span.on { opacity: .9; }
</style>
</head>
<body>
<div id="stage">
  <div id="strip"></div>
  <div id="dots"></div>
</div>
<script>
'use strict';
(async function () {
  const layout = await (await fetch('/layout.json', { cache: 'no-store' })).json();
  const stage = document.getElementById('stage'), strip = document.getElementById('strip'), dots = document.getElementById('dots');
  const W = layout.screen.width, H = layout.screen.height;
  stage.style.width = W + 'px'; stage.style.height = H + 'px';
  document.body.style.background = layout.background || '#000';

  // Older layouts had one flat "widgets" list with positions: treat that as a single page.
  const defs = Array.isArray(layout.widgets) ? Object.fromEntries(layout.widgets.map(w => [w.id, w])) : layout.widgets;
  const pages = layout.pages || [{ name: 'Main', items: layout.widgets.map(w => ({ widget: w.id, x: w.x, y: w.y, w: w.w, h: w.h })) }];

  // Every page is built once and kept loaded, so switching is instant and widgets stay connected.
  const frames = {};   // widget id -> [{ frame, origin }]
  const pageEls = pages.map((pg, i) => {
    const el = document.createElement('div');
    el.className = 'page'; el.style.left = (i * W) + 'px'; el.style.width = W + 'px';
    for (const it of pg.items) {
      const d = defs[it.widget];
      if (!d) { console.warn('Unknown widget in layout:', it.widget); continue; }
      const f = document.createElement('iframe');
      f.src = `http://127.0.0.1:${d.port}/`;
      f.title = `${it.widget} (${pg.name})`;
      Object.assign(f.style, { left: it.x + 'px', top: it.y + 'px', width: it.w + 'px', height: it.h + 'px' });
      el.appendChild(f);
      (frames[it.widget] = frames[it.widget] || []).push({ frame: f, origin: `http://127.0.0.1:${d.port}` });
    }
    strip.appendChild(el);
    return el;
  });
  strip.style.width = (pages.length * W) + 'px';

  // ---------- page switching ----------
  const dotEls = pages.map(() => dots.appendChild(document.createElement('span')));
  let dotsTimer = null;
  function flashDots() {
    if (pages.length < 2) return;
    dots.classList.add('show'); clearTimeout(dotsTimer);
    dotsTimer = setTimeout(() => dots.classList.remove('show'), 1200);
  }

  let current = 0;
  try { current = Math.min(pages.length - 1, Math.max(0, Number(localStorage.getItem('edge-page')) || 0)); } catch { /* storage off */ }
  function show(i) {
    current = (i + pages.length) % pages.length;   // wraps around, like iCUE
    strip.style.transform = `translateX(${-current * W}px)`;
    pageEls.forEach((el, n) => el.classList.toggle('away', n !== current));
    dotEls.forEach((b, n) => b.classList.toggle('on', n === current));
    try { localStorage.setItem('edge-page', String(current)); } catch { /* storage off */ }
  }
  strip.style.transition = 'none'; show(current); strip.offsetWidth; strip.style.transition = '';
  window.edgePage = step => { show(current + step); flashDots(); };   // Alt+Left / Alt+Right

  // ---------- live events from the server ----------
  const es = new EventSource('/api/events');
  es.addEventListener('settings', e => {
    const { id, settings } = JSON.parse(e.data);
    for (const t of frames[id] || []) if (t.frame.contentWindow) t.frame.contentWindow.postMessage({ type: 'edge-settings', settings }, t.origin);
  });
  es.addEventListener('page', e => { const d = JSON.parse(e.data); if (typeof d.step === 'number') edgePage(d.step); else if (typeof d.index === 'number') { show(d.index); flashDots(); } });
  es.addEventListener('reload', () => location.reload());

  // Scale the 2560x720 stage to the window, so a smaller preview window shows the whole layout.
  // The iframes keep their real CSS sizes, so the widgets' size media queries still match.
  function fit() {
    const s = Math.min(innerWidth / W, innerHeight / H);
    stage.style.transform = s === 1 ? '' : `scale(${s})`;
  }
  addEventListener('resize', fit); fit();
})();
</script>
</body>
</html>
