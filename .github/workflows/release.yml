# Packages the iCUE widgets and the Stream Deck icon pack.
# - Push a tag like v1.0.0 -> creates a GitHub Release with the files attached.
# - Run it by hand (Actions tab -> Release -> Run workflow) -> just builds them as a downloadable artifact.
# The App Launcher isn't included: its app list comes from your own Start menu (run launcher-edge/build.js).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Corsair's widget packager
        run: npm install -g icuewidget-cli@0.5.1

      - name: Package widgets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $widgets = @{
            'discord-edge'       = 'discord-voice'
            'apple-music-edge'   = 'apple-music'
            'notifications-edge' = 'notifications'
            'sensor-box-edge'    = 'sensor-box'
            'teams-edge'         = 'teams'
          }
          foreach ($dir in $widgets.Keys) {
            icuewidget package "$dir/widget" -o "dist/$($widgets[$dir]).icuewidget"
            if ($LASTEXITCODE -ne 0) { throw "Packaging $dir failed" }
          }

      - name: Zip the Stream Deck icon pack
        shell: pwsh
        run: Compress-Archive -Path wow-streamdeck/com.frank.wowmarkers.sdIconPack -DestinationPath dist/wow-raid-markers-icon-pack.zip

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/*

      - name: Create the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @'
          **Install:** download the `.icuewidget` files and import them in iCUE. Most widgets need the Edge helper running; see the README for setup.

          **Stream Deck icons:** unzip `wow-raid-markers-icon-pack.zip` into `%APPDATA%\Elgato\StreamDeck\IconPacks\`, then restart Stream Deck.

          **App Launcher:** not included, because it's built from your own Start menu. Run `node build.js` in `launcher-edge/`.
          '@
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem dist/*).FullName --title $env:GITHUB_REF_NAME --notes $notes
