<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>'Weather'</title>
<link rel="icon" type="image/png" href="resources/icon.png" />
<meta name="x-icue-property" content="weatherPlace" data-label="tr('Location')" data-type="textfield" data-default="''" />
<meta name="x-icue-property" content="weatherUnits" data-label="tr('Units')" data-type="combobox" data-default="'imperial'" data-values="[{'key':'imperial','value':tr('Fahrenheit, mph')},{'key':'metric','value':tr('Celsius, km/h')}]" />
<meta name="x-icue-property" content="weatherForecast" data-label="tr('Forecast on the S size')" data-type="combobox" data-default="'days'" data-values="[{'key':'days','value':tr('Next 5 days')},{'key':'hours','value':tr('Next hours')}]" />
<meta name="x-icue-property" content="weatherClock" data-label="tr('24-hour clock')" data-type="switch" data-default="false" />
<script type="application/json" id="x-icue-groups">
[
  { "title": "tr('Weather')", "properties": ["weatherPlace", "weatherUnits", "weatherForecast", "weatherClock"], "info": "tr('A town (\"Denver, CO\" or \"Paris, France\") or coordinates (\"39.74, -104.99\"). Forecasts are from Open-Meteo, no account needed.')" }
]
</script>
</head>
<body>
<style>
  :root { --bg: #111214; --panel: #1b1c1f; --panel2: #25262b; --text: #f2f3f5; --muted: #b4b9c2; --dim: #6f7f94; --sun: #ffc83d; --rain: #4ea7ff; --gap: 2.2vmin; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font-family: "Segoe UI Variable Display", "Segoe UI", "Noto Sans", sans-serif; user-select: none; }

  /* Layouts (set from the size in draw()):
     S       now | 5 days or hours (tap to switch)
     L       now | hours over days
     M       now, then hours, then days
     W       now | hours | days            (wide and full width) */
  #app { width: 100%; height: 100%; padding: var(--gap); display: grid; gap: var(--gap); }
  body.lay-s #app { grid-template-columns: 0.95fr 1.3fr; grid-template-areas: "now fc"; }
  body.lay-s #hours, body.lay-s #days { grid-area: fc; }
  body.lay-s.show-days #hours, body.lay-s.show-hours #days { display: none; }
  body.lay-s #hours, body.lay-s #days { cursor: pointer; }
  body.lay-l #app { grid-template-columns: 0.8fr 1.6fr; grid-template-rows: 1fr 1fr; grid-template-areas: "now hours" "now days"; }
  body.lay-m #app { grid-template-rows: 0.85fr 1fr 1fr; grid-template-areas: "now" "hours" "days"; }
  body.lay-w #app { grid-template-columns: 0.75fr 1.5fr 1.25fr; grid-template-areas: "now hours days"; }
  #now { grid-area: now; } #hours { grid-area: hours; } #days { grid-area: days; }
  /* Text in the tiles grows with the tile's height; M has two rows of short tiles, so it
     scales it up to match S and the wide sizes. */
  body { --k: 1; }
  body.lay-m { --k: 1.6; }
  body.lay-m .tile > svg { width: min(29cqh, 70cqw); height: min(29cqh, 70cqw); margin: -2cqh 0; }
  body.lay-m .tile .tt { gap: 1cqh; }

  .card { background: var(--panel); border-radius: 2.4vmin; min-width: 0; min-height: 0; overflow: hidden; position: relative; }

  /* current conditions: sized from its own card, so it looks the same in every layout */
  #now { container-type: size; padding: 2.6vmin 3vmin; display: flex; flex-direction: column; justify-content: space-between; }
  #now .place { font-size: min(6.2cqh, 5.4cqw); font-weight: 700; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #now .main { display: flex; align-items: center; gap: 3cqh; }
  #now .main svg { width: min(30cqh, 28cqw); height: min(30cqh, 28cqw); flex: 0 0 auto; }
  #now .temp { font-size: min(27cqh, 25cqw); font-weight: 700; line-height: .9; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  #now .temp sup { font-size: .4em; font-weight: 600; color: var(--muted); vertical-align: top; margin-left: .1em; }
  #now .cond { font-size: min(8cqh, 7cqw); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #now .meta { display: flex; gap: 1em; font-size: min(5.6cqh, 4.6cqw); color: var(--muted); font-weight: 600; white-space: nowrap; margin-top: .3em; }
  #now .meta b { color: var(--text); font-weight: 700; }
  /* A wide, short card (M): conditions on the left, details on the right */
  body.lay-m #now { flex-direction: row; align-items: center; padding: 2.6vmin 3vmin; }
  body.lay-m #now .place { position: absolute; top: 2.6vmin; left: 3vmin; font-size: 11cqh; }
  body.lay-m #now .main svg { width: 44cqh; height: 44cqh; } body.lay-m #now .temp { font-size: 40cqh; }
  body.lay-m #now > div:last-child { text-align: right; } body.lay-m #now .cond { font-size: 14cqh; } body.lay-m #now .meta { font-size: 11cqh; justify-content: flex-end; }

  /* the hours and days cards: a row of tiles */
  #hours, #days { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: var(--gap); padding: var(--gap); }
  .tile { container-type: size; background: var(--panel2); border-radius: 2vmin; min-width: 0; min-height: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 1.8vmin 0 1.6vmin; }
  .tile .t { font-size: min(calc(7cqh * var(--k)), 22cqw); font-weight: 700; color: var(--muted); white-space: nowrap; }
  .tile.first .t { color: var(--text); }
  .tile > svg { width: min(26cqh, 78cqw); height: min(26cqh, 78cqw); margin: -2cqh 0; }
  .tile .tt { display: flex; flex-direction: column; align-items: center; gap: 2cqh; }
  .tile .hi { font-size: min(calc(12.5cqh * var(--k)), 36cqw); font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .tile .lo { font-size: min(calc(7.5cqh * var(--k)), 23cqw); font-weight: 700; line-height: 1; color: var(--muted); font-variant-numeric: tabular-nums; }
  .rain { display: flex; align-items: center; gap: .2em; font-size: min(calc(6cqh * var(--k)), 18cqw); font-weight: 700; color: var(--rain); }
  .rain svg { width: .8em; height: .8em; }
  .rain.low { color: var(--dim); }

  #msg { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 2vh; text-align: center; padding: 6vh; }
  #msg b { font-size: 6vh; } #msg span { font-size: 4vh; color: var(--muted); }
</style>
<div id="app">
  <div class="card" id="now"></div>
  <div class="card" id="hours"></div>
  <div class="card" id="days"></div>
</div>
<div id="msg"><b></b><span></span></div>
<script>
'use strict';
// ---------- icons (drawn here, no image files) ----------
const SUN = (cx, cy, r) => `<circle cx="${cx}" cy="${cy}" r="${r}" fill="#ffc83d"/>` + [...Array(8)].map((_, i) => { const a = i * Math.PI / 4, x1 = cx + Math.cos(a) * (r + 5), y1 = cy + Math.sin(a) * (r + 5), x2 = cx + Math.cos(a) * (r + 11), y2 = cy + Math.sin(a) * (r + 11); return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#ffc83d" stroke-width="4" stroke-linecap="round"/>`; }).join('');
const MOON = (cx, cy, r) => `<path d="M${cx + r * .35} ${cy - r} a${r} ${r} 0 1 0 ${r * .65} ${r * 1.55} a${r * .85} ${r * .85} 0 0 1 -${r * .65} -${r * 1.55}z" fill="#d9dcff"/>`;
const CLOUD = (x, y, s, c = '#c9ced8') => `<path transform="translate(${x} ${y}) scale(${s})" d="M14 44h40a12 12 0 0 0 0-24 18 18 0 0 0-34-4A14 14 0 0 0 14 44z" fill="${c}"/>`;
const DROPS = (c, n = 3) => [...Array(n)].map((_, i) => `<line x1="${30 + i * 14}" y1="70" x2="${26 + i * 14}" y2="82" stroke="${c}" stroke-width="4" stroke-linecap="round"/>`).join('');
const FLAKES = () => [...Array(3)].map((_, i) => `<circle cx="${30 + i * 14}" cy="${74 + (i % 2) * 6}" r="3.2" fill="#eaf4ff"/>`).join('');
const ICONS = {
  'clear-day': SUN(48, 48, 17), 'clear-night': MOON(48, 46, 22),
  'partly-day': SUN(36, 34, 13) + CLOUD(22, 26, 1.05), 'partly-night': MOON(36, 34, 15) + CLOUD(22, 26, 1.05),
  cloudy: CLOUD(8, 10, 1.05, '#8f96a3') + CLOUD(22, 24, 1.05),
  fog: CLOUD(18, 8, 1.05, '#9aa1ad') + [60, 70, 80].map((y, i) => `<line x1="${18 + i * 4}" y1="${y}" x2="${78 - i * 4}" y2="${y}" stroke="#9aa1ad" stroke-width="4" stroke-linecap="round"/>`).join(''),
  drizzle: CLOUD(16, 6, 1.05) + DROPS('#7dbbff', 2), rain: CLOUD(16, 6, 1.05, '#9aa4b4') + DROPS('#4ea7ff'),
  snow: CLOUD(16, 6, 1.05) + FLAKES(),
  storm: CLOUD(16, 6, 1.05, '#7d8594') + `<path d="M50 60l-10 16h9l-5 14 15-20h-9l6-10z" fill="#ffc83d"/>`,
};
const icon = (kind) => `<svg viewBox="0 0 96 96">${ICONS[kind] || ICONS.cloudy}</svg>`;

// WMO weather codes (what Open-Meteo returns)
function kindOf(code, day) {
  if (code === 0) return day ? 'clear-day' : 'clear-night';
  if (code <= 2) return day ? 'partly-day' : 'partly-night';
  if (code === 3) return 'cloudy';
  if (code === 45 || code === 48) return 'fog';
  if (code >= 51 && code <= 57) return 'drizzle';
  if ((code >= 61 && code <= 67) || (code >= 80 && code <= 82)) return 'rain';
  if ((code >= 71 && code <= 77) || code === 85 || code === 86) return 'snow';
  if (code >= 95) return 'storm';
  return 'cloudy';
}
const WORDS = { 0: 'Clear', 1: 'Mostly clear', 2: 'Partly cloudy', 3: 'Cloudy', 45: 'Fog', 48: 'Freezing fog', 51: 'Light drizzle', 53: 'Drizzle', 55: 'Heavy drizzle',
  56: 'Freezing drizzle', 57: 'Freezing drizzle', 61: 'Light rain', 63: 'Rain', 65: 'Heavy rain', 66: 'Freezing rain', 67: 'Freezing rain', 71: 'Light snow', 73: 'Snow',
  75: 'Heavy snow', 77: 'Snow grains', 80: 'Showers', 81: 'Showers', 82: 'Heavy showers', 85: 'Snow showers', 86: 'Snow showers', 95: 'Thunderstorms', 96: 'Thunderstorms, hail', 99: 'Thunderstorms, hail' };

// ---------- settings ----------
const setting = (k, d) => { try { const v = window[k]; return v === undefined || v === null || v === '' ? d : v; } catch { return d; } };
const STATES = { AL: 'Alabama', AK: 'Alaska', AZ: 'Arizona', AR: 'Arkansas', CA: 'California', CO: 'Colorado', CT: 'Connecticut', DE: 'Delaware', FL: 'Florida', GA: 'Georgia',
  HI: 'Hawaii', ID: 'Idaho', IL: 'Illinois', IN: 'Indiana', IA: 'Iowa', KS: 'Kansas', KY: 'Kentucky', LA: 'Louisiana', ME: 'Maine', MD: 'Maryland', MA: 'Massachusetts',
  MI: 'Michigan', MN: 'Minnesota', MS: 'Mississippi', MO: 'Missouri', MT: 'Montana', NE: 'Nebraska', NV: 'Nevada', NH: 'New Hampshire', NJ: 'New Jersey', NM: 'New Mexico',
  NY: 'New York', NC: 'North Carolina', ND: 'North Dakota', OH: 'Ohio', OK: 'Oklahoma', OR: 'Oregon', PA: 'Pennsylvania', RI: 'Rhode Island', SC: 'South Carolina',
  SD: 'South Dakota', TN: 'Tennessee', TX: 'Texas', UT: 'Utah', VT: 'Vermont', VA: 'Virginia', WA: 'Washington', WV: 'West Virginia', WI: 'Wisconsin', WY: 'Wyoming', DC: 'District of Columbia' };

// "Denver, CO" -> { lat, lon, name } via Open-Meteo's geocoder (cached), or "39.74, -104.99" as is.
async function place(text) {
  const coords = /^\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*$/.exec(text);
  if (coords) return { lat: +coords[1], lon: +coords[2], name: text.trim() };
  const cacheKey = 'wx-place:' + text.toLowerCase();
  try { const c = JSON.parse(localStorage.getItem(cacheKey)); if (c) return c; } catch { /* none */ }
  const [name, ...rest] = text.split(',').map(s => s.trim());
  const qual = rest.join(', ').toLowerCase();
  const r = await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?count=10&language=en&format=json&name=${encodeURIComponent(name)}`)).json();
  const list = r.results || [];
  const want = STATES[qual.toUpperCase()] ? STATES[qual.toUpperCase()].toLowerCase() : qual;
  const hit = (qual && list.find(p => [p.admin1, p.country, p.country_code].some(x => x && x.toLowerCase() === want))) || list[0];
  if (!hit) throw new Error(`Couldn't find "${text}"`);
  // Rounded to about 1 km: plenty for a forecast, and all that's sent to the weather service.
  const out = { lat: Math.round(hit.latitude * 100) / 100, lon: Math.round(hit.longitude * 100) / 100, name: hit.name };
  try { localStorage.setItem(cacheKey, JSON.stringify(out)); } catch { /* private */ }
  return out;
}

// ---------- fetch + draw ----------
let data = null, where = null, timer = null;
const $ = id => document.getElementById(id);
function showMsg(title, sub) { $('msg').style.display = 'flex'; $('app').style.visibility = 'hidden'; $('msg').querySelector('b').textContent = title; $('msg').querySelector('span').textContent = sub || ''; }

async function refresh() {
  clearTimeout(timer); timer = setTimeout(refresh, 15 * 60 * 1000);
  const text = String(setting('weatherPlace', '')).trim();
  if (!text) return showMsg('Where are you?', 'Set a location in the dashboard settings (Weather).');
  try {
    where = await place(text);
    const imperial = setting('weatherUnits', 'imperial') !== 'metric';
    const q = new URLSearchParams({ latitude: where.lat, longitude: where.lon, timezone: 'auto', forecast_days: 7,
      current: 'temperature_2m,apparent_temperature,weather_code,is_day,wind_speed_10m,relative_humidity_2m',
      hourly: 'temperature_2m,weather_code,precipitation_probability,is_day',
      daily: 'weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max',
      ...(imperial ? { temperature_unit: 'fahrenheit', wind_speed_unit: 'mph', precipitation_unit: 'inch' } : {}) });
    data = await (await fetch('https://api.open-meteo.com/v1/forecast?' + q)).json();
    if (data.error) throw new Error(data.reason || 'weather service error');
    data._imperial = imperial; data._at = new Date();
    draw();
  } catch (e) {
    if (!data) showMsg('No weather right now', e.message);
    clearTimeout(timer); timer = setTimeout(refresh, 60 * 1000);   // try again soon
  }
}

const r0 = v => Math.round(v);
function hourLabel(d, i) {
  if (i === 0) return 'Now';
  if (setting('weatherClock', false) === true || setting('weatherClock', false) === 'true') return String(d.getHours()).padStart(2, '0') + ':00';
  const h = d.getHours() % 12 || 12; return h + (d.getHours() < 12 ? 'a' : 'p');
}

// What the S size shows: a tap on the forecast card switches it and is remembered; changing the
// Forecast setting starts from that again.
let tapMode = null, tapFor = null;
try { const m = JSON.parse(localStorage.getItem('weatherTap') || 'null'); if (m) { tapMode = m.mode; tapFor = m.for; } } catch { /* ignore */ }
function smallMode() {
  const s = setting('weatherForecast', 'days') === 'hours' ? 'hours' : 'days';
  return tapMode && tapFor === s ? tapMode : s;
}
document.addEventListener('click', e => {
  if (!e.target.closest('#hours, #days') || !document.body.classList.contains('lay-s')) return;
  tapFor = setting('weatherForecast', 'days') === 'hours' ? 'hours' : 'days';
  tapMode = smallMode() === 'days' ? 'hours' : 'days';
  try { localStorage.setItem('weatherTap', JSON.stringify({ mode: tapMode, for: tapFor })); } catch { /* ignore */ }
  draw();
});

// Rain chance on every tile, with a drop; dimmed under 20%.
const DROP = '<svg viewBox="0 0 24 24"><path d="M12 3c3.5 4.6 6 8 6 11a6 6 0 0 1-12 0c0-3 2.5-6.4 6-11z" fill="currentColor"/></svg>';
const rain = p => `<div class="rain${p >= 20 ? '' : ' low'}">${DROP}${p == null ? 0 : p}%</div>`;

// Which layout fits the widget's size: S (840x344), L (1690x704), M (840x704), W (wide and full width).
function layout() {
  const W = innerWidth, H = innerHeight, r = W / H;
  return r <= 1.3 ? 'm' : r >= 3 ? 'w' : H >= 500 ? 'l' : 's';
}

function draw() {
  if (!data) return;
  $('msg').style.display = 'none'; $('app').style.visibility = '';
  const lay = layout();
  for (const k of ['s', 'l', 'm', 'w']) document.body.classList.toggle('lay-' + k, k === lay);
  const mode = smallMode();
  document.body.classList.toggle('show-days', lay === 's' && mode === 'days');
  document.body.classList.toggle('show-hours', lay === 's' && mode === 'hours');

  const c = data.current, unit = data._imperial ? 'mph' : 'km/h';
  const today = { hi: data.daily.temperature_2m_max[0], lo: data.daily.temperature_2m_min[0] };
  $('now').innerHTML = `
    <div class="place">${where.name}</div>
    <div class="main">${icon(kindOf(c.weather_code, c.is_day))}<div class="temp">${r0(c.temperature_2m)}<sup>°</sup></div></div>
    <div><div class="cond">${WORDS[c.weather_code] || ''}</div>
      <div class="meta"><span>H <b>${r0(today.hi)}°</b></span><span>L <b>${r0(today.lo)}°</b></span><span>Feels <b>${r0(c.apparent_temperature)}°</b></span><span>${r0(c.wind_speed_10m)} ${unit}</span></div></div>`;

  // Hours: 6 tiles. Every hour on M (narrow tiles cover less), every 2 hours elsewhere (12 hours ahead).
  const now = new Date(), times = data.hourly.time.map(t => new Date(t));
  let start = times.findIndex(t => t.getTime() + 3600e3 > now.getTime()); if (start < 0) start = 0;
  const stepH = lay === 'm' ? 1 : 2;
  let hours = '';
  for (let i = 0; i < 6; i++) {
    const k = start + i * stepH; if (k >= times.length) break;
    hours += `<div class="tile${i === 0 ? ' first' : ''}"><div class="t">${hourLabel(times[k], i)}</div>${icon(kindOf(data.hourly.weather_code[k], data.hourly.is_day[k]))}
      <div class="tt"><div class="hi">${r0(data.hourly.temperature_2m[k])}°</div></div>${rain(data.hourly.precipitation_probability[k])}</div>`;
  }
  $('hours').innerHTML = hours;

  // Days: 5 tiles, high over low.
  const d = data.daily;
  let days = '';
  for (let i = 0; i < 5 && i < d.time.length; i++) {
    const date = new Date(d.time[i] + 'T12:00');
    days += `<div class="tile${i === 0 ? ' first' : ''}"><div class="t">${i === 0 ? 'Today' : date.toLocaleDateString('en-US', { weekday: 'short' })}</div>${icon(kindOf(d.weather_code[i], 1))}
      <div class="tt"><div class="hi">${r0(d.temperature_2m_max[i])}°</div><div class="lo">${r0(d.temperature_2m_min[i])}°</div></div>${rain(d.precipitation_probability_max[i])}</div>`;
  }
  $('days').innerHTML = days;
}

window.icueEvents = {
  onICUEInitialized: refresh,
  onDataUpdated: p => { if (p && p.settings) for (const [k, v] of Object.entries(p.settings)) window[k] = v; data = null; refresh(); },
};
new ResizeObserver(() => draw()).observe(document.body);
addEventListener('resize', () => draw());
// Not in iCUE or the dashboard (a plain browser): start anyway.
setTimeout(() => { if (!data && !timer) refresh(); }, 1500);
</script>
</body>
</html>
