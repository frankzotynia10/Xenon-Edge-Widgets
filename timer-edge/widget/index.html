<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>'Timer'</title>
<link rel="icon" type="image/png" href="resources/icon.png" />
<meta name="x-icue-property" content="timerPresets" data-label="tr('Presets (minutes)')" data-type="textfield" data-default="'1, 3, 5, 10, 15, 25'" />
<meta name="x-icue-property" content="timerSound" data-label="tr('Beep when done')" data-type="switch" data-default="true" />
<meta name="x-icue-property" content="timerAccent" data-label="tr('Accent color')" data-type="color" data-default="'#4CC2FF'" />
<script type="application/json" id="x-icue-groups">
[
  { "title": "tr('Timer')", "properties": ["timerPresets", "timerSound", "timerAccent"], "info": "tr('Tap a preset to start. Tap the time to pause or resume; -1 and +1 change it while it runs.')" }
]
</script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body>
<style>
  :root { --bg: #111214; --panel: #1b1c1f; --panel2: #26272b; --text: #f2f3f5; --muted: #949ba4; --accent: #4CC2FF; --done: #f0b232; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font-family: "Segoe UI Variable Display", "Segoe UI", sans-serif; user-select: none; -webkit-user-select: none; }
  button { font: inherit; color: inherit; border: none; background: none; cursor: pointer; outline: none; -webkit-tap-highlight-color: transparent; }
  #wrap { position: absolute; inset: 0; padding: 16px; display: flex; gap: 18px; align-items: center; }
  body.tallish #wrap { flex-direction: column; justify-content: center; }
  #dial { position: relative; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; border-radius: 50%; }
  #dial svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
  #dial circle { fill: none; stroke-width: 12; }
  #dial .bgc { stroke: var(--panel2); }
  #dial .fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .25s linear; }
  #time { position: relative; text-align: center; }
  #clock { font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: -.01em; }
  #state { margin-top: 6px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; }
  body.done #dial .fg { stroke: var(--done); }
  body.done #clock { color: var(--done); animation: blink 1s steps(1) infinite; }
  body.paused #clock { color: var(--muted); }
  @keyframes blink { 50% { opacity: .25; } }
  #side { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; gap: 12px; justify-content: center; }
  body.tallish #side { width: 100%; flex: 0 0 auto; height: auto; }
  #presets { display: grid; gap: 10px; }
  .btn { background: var(--panel); border-radius: 14px; font-weight: 700; display: flex; align-items: center; justify-content: center; transition: transform .08s, background .2s; }
  .btn:active { transform: scale(.94); }
  .btn.on { background: var(--accent); color: #0b1a24; }
  #ctl { display: grid; grid-template-columns: 1fr 1fr 1.4fr; gap: 10px; }
  #ctl .btn { color: var(--muted); }
  #ctl .btn.primary { background: var(--panel2); color: var(--text); }
  #flash { position: absolute; inset: 0; pointer-events: none; background: var(--done); opacity: 0; }
  body.done #flash { animation: flash 2s ease-out 3; }
  @keyframes flash { 0% { opacity: .35; } 100% { opacity: 0; } }
</style>
<div id="wrap">
  <button id="dial" aria-label="Pause or resume">
    <svg viewBox="0 0 100 100"><circle class="bgc" cx="50" cy="50" r="44"/><circle class="fg" id="ring" cx="50" cy="50" r="44" stroke-dasharray="276.46" stroke-dashoffset="276.46" opacity="0"/></svg>
    <div id="time"><div id="clock">0:00</div><div id="state">Ready</div></div>
  </button>
  <div id="side">
    <div id="presets"></div>
    <div id="ctl">
      <button class="btn" id="minus">−1</button>
      <button class="btn" id="plus">+1</button>
      <button class="btn primary" id="reset">Reset</button>
    </div>
  </div>
</div>
<div id="flash"></div>
<script>
'use strict';
const $ = id => document.getElementById(id);
const C = 2 * Math.PI * 44;
// The timer: { total: ms, end: epoch ms while running, left: ms while paused }. Kept in localStorage
// so a running timer survives the dashboard reloading.
let t = load() || { total: 0, end: 0, left: 0 };
let presets = [1, 3, 5, 10, 15, 25], sound = true, beeped = false;

function load() { try { return JSON.parse(localStorage.getItem('timer') || 'null'); } catch { return null; } }
function save() { try { localStorage.setItem('timer', JSON.stringify(t)); } catch { /* ignore */ } }
const running = () => t.end > 0;
const remaining = () => running() ? Math.max(0, t.end - Date.now()) : t.left;

function start(min) { t = { total: min * 60000, end: Date.now() + min * 60000, left: 0, preset: min }; beeped = false; save(); draw(); }
function toggle() {
  if (running()) { t.left = remaining(); t.end = 0; }
  else if (t.left > 0) { t.end = Date.now() + t.left; t.left = 0; }
  else if (t.total) { t.end = Date.now() + t.total; beeped = false; }   // finished: start the same again
  save(); draw();
}
function add(min) {
  if (!t.total) return start(Math.max(1, min));
  const d = min * 60000;
  if (running()) t.end = Math.max(Date.now() + 1000, t.end + d); else t.left = Math.max(0, t.left + d);
  t.total = Math.max(t.total + d, remaining()); beeped = false; save(); draw();
}
function reset() { t = { total: 0, end: 0, left: 0 }; save(); draw(); }

function fmt(ms) {
  const s = Math.ceil(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return h ? `${h}:${String(m).padStart(2, '0')}:${String(x).padStart(2, '0')}` : `${m}:${String(x).padStart(2, '0')}`;
}
function beep() {
  if (!sound) return;
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    [0, .35, .7].forEach(at => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(ac.destination);
      g.gain.setValueAtTime(0.0001, ac.currentTime + at); g.gain.exponentialRampToValueAtTime(0.25, ac.currentTime + at + .02);
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + at + .25);
      o.start(ac.currentTime + at); o.stop(ac.currentTime + at + .3);
    });
    setTimeout(() => ac.close(), 1500);
  } catch { /* no audio */ }
}

function draw() {
  const left = remaining(), done = t.total > 0 && running() && left === 0;
  if (done && !beeped) { beeped = true; beep(); }
  document.body.classList.toggle('done', done);
  document.body.classList.toggle('paused', !running() && t.left > 0);
  $('clock').textContent = fmt(t.total ? left : 0);
  $('state').textContent = done ? "Time's up" : running() ? 'Tap to pause' : t.left > 0 ? 'Paused' : t.total ? 'Tap to restart' : 'Pick a time';
  $('ring').style.strokeDashoffset = t.total ? C * (1 - left / t.total) : C;   // nothing set: empty ring
  $('ring').style.opacity = t.total ? 1 : 0;
  for (const b of $('presets').children) b.classList.toggle('on', running() && Number(b.dataset.m) === t.preset);
}

function layout() {
  const W = innerWidth, H = innerHeight, tall = H > W * 0.8;
  document.body.classList.toggle('tallish', tall);
  const d = tall ? Math.min(W - 40, H * 0.55) : Math.min(H - 32, W * 0.45);
  $('dial').style.width = $('dial').style.height = d + 'px';
  $('clock').style.fontSize = Math.round(d * (t.total >= 3600000 ? 0.16 : 0.22)) + 'px';
  $('state').style.fontSize = Math.max(12, Math.round(d * 0.055)) + 'px';
  const cols = presets.length <= 4 ? presets.length : Math.ceil(presets.length / 2);
  $('presets').style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
  const bh = Math.max(48, Math.min(110, (tall ? H * 0.12 : (H - 32 - 24) / (Math.ceil(presets.length / cols) + 1))));
  for (const b of document.querySelectorAll('.btn')) { b.style.height = bh + 'px'; b.style.fontSize = Math.round(bh * 0.36) + 'px'; }
}
function buildPresets() {
  $('presets').innerHTML = presets.map(m => `<button class="btn" data-m="${m}">${m >= 60 && m % 60 === 0 ? m / 60 + 'h' : m + 'm'}</button>`).join('');
  layout(); draw();
}

// Settings arrive as globals (window.timerPresets etc.), from iCUE or the Edge dashboard.
function applySettings() {
  const p = String(window.timerPresets || '1, 3, 5, 10, 15, 25').split(/[,\s]+/).map(Number).filter(n => n > 0 && n <= 600).slice(0, 8);
  presets = p.length ? p : [5, 10, 25];
  sound = window.timerSound !== false && window.timerSound !== 'false';
  if (window.timerAccent) document.documentElement.style.setProperty('--accent', window.timerAccent);
  buildPresets();
}
window.icueEvents = { onICUEInitialized: applySettings, onDataUpdated: applySettings };

$('presets').addEventListener('click', e => { const b = e.target.closest('[data-m]'); if (b) start(Number(b.dataset.m)); });
$('dial').addEventListener('click', toggle);
$('minus').addEventListener('click', () => add(-1));
$('plus').addEventListener('click', () => add(1));
$('reset').addEventListener('click', reset);
addEventListener('resize', layout);
setInterval(draw, 250);
applySettings();
</script>
</body>
</html>
